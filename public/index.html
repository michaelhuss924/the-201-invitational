function initials(s){return (s||'FF').split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join('').toUpperCase()}
function nf(v){return Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2});}
function slug(s){return (s||'the-201-invitational').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')}
function initSeasons(){data.seasons=data.seasons||[];let start=Math.max(2000,Math.min(2026,Number(data.settings.founded)||2012));for(let y=start;y<=CURRENT_YEAR;y++){if(!data.seasons.some(s=>Number(s.year)===y))data.seasons.push({year:y,champion:'',runnerUp:'',regularSeason:'',highestPoints:'',notes:'',standings:[]})}data.seasons.sort((a,b)=>b.year-a.year)}
initSeasons();
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){toast('Local browser storage is unavailable. Export the site to save your work.')}}
function switchPage(page){state.page=page;location.hash=page==='home'?'home':page;state.articleId=null;state.ownerId=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(){return `<div class="topbar"><div class="wrap"><span class="mono"><b>●</b> THE 201 INVITATIONAL ARCHIVE <span class="tiny-dot"></span> EST. ${esc(data.settings.founded)}</span><span class="right mono">POWER RANKINGS <span class="tiny-dot"></span> DEBATES <span class="tiny-dot"></span> LEGACY</span></div></div><header class="masthead"><div class="wrap masthead-inner"><button class="brand" data-action="nav" data-page="home" aria-label="Go home"><span class="brandmark">201</span><span><span class="brand-name">${esc(data.settings.name)}</span><span class="brand-sub">${esc(data.settings.subtitle)}</span></span></button><nav class="nav" aria-label="Main navigation"><button data-action="nav" data-page="home" class="${state.page==='home'?'active':''}">Home</button><button data-action="nav" data-page="rankings" class="${state.page==='rankings'?'active':''}">Power rankings</button><button data-action="nav" data-page="history" class="${state.page==='history'?'active':''}">League history</button><button data-action="nav" data-page="owners" class="${state.page==='owners'?'active':''}">Owners Hall</button><button data-action="nav" data-page="countdown" class="${state.page==='countdown'?'active':''}">201 Countdown</button><button data-action="nav" data-page="sleeper" class="${state.page==='sleeper'?'active':''}">Sleeper hub</button></nav><button class="studio-btn" data-action="open-studio">✎ &nbsp; Edit site</button></div></header>`}
function iconTrophy(){return `<svg class="trophy-art" viewBox="0 0 300 300" fill="none" aria-hidden="true"><defs><linearGradient id="gold" x1="45" y1="0" x2="250" y2="250"><stop stop-color="#f4f9c4"/><stop offset=".36" stop-color="#d8ea8b"/><stop offset=".76" stop-color="#91b45f"/><stop offset="1" stop-color="#557648"/></linearGradient></defs><path d="M100 62h100l-6 103c-3 47-32 66-45 66s-42-19-45-66L100 62Z" fill="url(#gold)"/><path d="M103 83H63c1 46 10 77 47 78m87-78h40c-1 46-10 77-47 78" stroke="#d4e895" stroke-width="19" stroke-linecap="round"/><path d="M148 232v20m-38 0h78m-92 18h104" stroke="#b9d777" stroke-width="16" stroke-linecap="round"/><path d="m150 97 13 26 29 4-21 21 5 30-26-14-26 14 5-30-21-21 29-4 13-26Z" fill="#eff7b8" opacity=".9"/><path d="M115 75h70" stroke="#fff" stroke-width="4" opacity=".48"/></svg>`}
function articlesSorted(){return data.articles.filter(a=>a.published!==false).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function home(){const arts=articlesSorted(),main=arts[0],others=arts.slice(1,3);const recorded=data.seasons.filter(s=>s.champion).length;
return `<section class="hero"><div class="wrap hero-inner"><div class="hero-copy"><div class="hero-topline mono">Football is temporary. Legacy is forever.</div><h1 class="display">THE SEASON<br>ENDS. <span>THE<br>RECEIPTS</span><br>DON'T.</h1><p class="hero-description">${esc(data.settings.description)}</p><div class="hero-actions"><button class="btn" data-action="nav" data-page="rankings">See the rankings <span>↗</span></button><button class="btn outline" data-action="nav" data-page="history">Explore the archive <span>→</span></button></div></div><div class="field-art"><div class="field-number">201</div>${iconTrophy()}<div class="art-stamp"><span>ESTABLISHED</span><strong>${esc(data.settings.founded)}</strong><span>LEGENDS ONLY</span></div></div></div></section>
<div class="stats-bar"><div class="wrap stat-inner"><div class="stat"><div class="stat-n">${esc(data.settings.founded)}</div><div class="stat-l">The first<br>season</div></div><div class="stat"><div class="stat-n">${CURRENT_YEAR-Number(data.settings.founded)+1}</div><div class="stat-l">Seasons in<br>the archive</div></div><div class="stat"><div class="stat-n">${data.teams.length||'—'}</div><div class="stat-l">Registered<br>teams</div></div><div class="stat"><div class="stat-n">${recorded||'—'}</div><div class="stat-l">Seasons with<br>results</div></div></div></div>
<main class="main wrap"><div class="section-heading"><div><div class="eyebrow mono">01 / From the Commissioner's Desk</div><h2 class="display">LATEST <span>HEADLINES</span></h2><div class="heading-sub">Big takes. Bad trades. Permanent receipts.</div></div><button class="section-link" data-action="open-studio" data-studio-tab="articles">Write an article ↗</button></div>
<div class="feature-layout">${main?`<article class="feature-story story-card-click" data-action="read-article" data-id="${esc(main.id)}"><div class="topography"></div><div class="huge-icon">’26</div><div class="feature-content"><span class="feature-tag mono">${esc(main.category||'LEAGUE NEWS')}</span><h3>${esc(main.title)}</h3><p>${esc(main.excerpt)}</p><div class="feature-meta mono">${esc(main.author||'The Commissioner')} &nbsp; / &nbsp; ${dateFmt(main.date)} &nbsp; → READ STORY</div></div></article>`:`<div class="feature-story"><div class="topography"></div><div class="feature-content"><span class="feature-tag mono">NEWS DESK</span><h3>Your next big story starts here.</h3><p>Publish the first piece from the Commissioner Studio.</p><button class="btn" data-action="open-studio" data-studio-tab="articles">Write an article →</button></div></div>`}<div class="story-mini-stack">${others.length?others.map(a=>`<article class="mini-story story-card-click" data-action="read-article" data-id="${esc(a.id)}"><div><div class="eyebrow mono">${esc(a.category||'LEAGUE NEWS')}</div><h3>${esc(a.title)}</h3><p>${esc(a.excerpt)}</p></div><div class="mini-meta mono">${dateFmt(a.date)} &nbsp; • &nbsp; READ MORE →</div></article>`).join(''):`<div class="mini-story"><div><div class="eyebrow mono">THE NEWSROOM</div><h3>Every rivalry deserves a headline.</h3><p>Trade grades, playoff predictions, weekly recaps, commissioner updates — publish whatever fuels the group chat.</p></div><div class="mini-meta mono">YOUR NEXT ARTICLE GOES HERE →</div></div><div class="mini-story"><div><div class="eyebrow mono">THE MAILBAG</div><h3>Hot takes welcome. Evidence preferred.</h3><p>Add as many articles as you like from the editor. Your newest stories automatically appear here.</p></div><div class="mini-meta mono">STORIES / ANALYSIS / OPINIONS</div></div>`}</div></div>
<div class="section-space"><div class="section-heading"><div><div class="eyebrow mono">02 / Official pecking order</div><h2 class="display">POWER <span>RANKINGS</span></h2><div class="heading-sub">Two lists. Two completely different arguments.</div></div><button class="section-link" data-action="nav" data-page="rankings">All rankings ↗</button></div><div class="rank-home-grid">${rankTeaser('season2026')}${rankTeaser('dynasty')}</div></div>

function rankTeaser(type){const r=data.rankings[type]||{entries:[]},items=(r.entries||[]).slice(0,3),dark=type==='dynasty',title=dark?'DYNASTY RANKINGS':'2026 POWER RANKINGS';return `<div class="rank-teaser ${dark?'dark':''}"><div class="rank-teaser-top"><div><div class="eyebrow mono">${dark?'THE LONG GAME':'THE ROAD TO THE TITLE'}</div><h3 class="display">${title}</h3></div><span class="number-watermark">${dark?'∞':'26'}</span></div><div class="rank-list-mini">${items.length?items.map((x,i)=>`<div class="rank-mini-row"><span class="rank-mini-no">${i+1}</span><span class="rank-mini-name">${esc(x.team)}</span><span class="rank-mini-desc mono">${esc(x.record||x.trend||'—')}</span></div>`).join(''):`<p class="rank-empty">The board is ready. Add your teams and publish the first official rankings.</p><div class="rank-mini-row"><span class="rank-mini-no">01</span><span class="rank-mini-name muted">The top spot is up for grabs</span></div><div class="rank-mini-row"><span class="rank-mini-no">02</span><span class="rank-mini-name muted">A contender will emerge</span></div><div class="rank-mini-row"><span class="rank-mini-no">03</span><span class="rank-mini-name muted">Somebody will be furious</span></div>`}</div><div class="rank-teaser-bottom"><span class="mono">${r.updated?'UPDATED '+dateFmt(r.updated):'EDITION PENDING'}</span><button data-action="rank-tab" data-type="${type}">Full rankings ↗</button></div></div>`}
function rankings(){const type=state.rankTab,r=data.rankings[type]||{entries:[]},entries=r.entries||[];return `${pageTop('02 / THE HIERARCHY','POWER RANKINGS','Unbiased analysis. Questionable methodology. Extremely confident opinions.')}<main class="main wrap"><div class="tabs"><button data-action="rank-tab" data-type="season2026" class="${type==='season2026'?'active':''}">2026 power rankings</button><button data-action="rank-tab" data-type="dynasty" class="${type==='dynasty'?'active':''}">Dynasty power rankings</button></div><div class="rank-intro"><div><div class="eyebrow mono">${type==='dynasty'?'LONG-TERM CONTENDER INDEX':'THE 2026 EDITION'}</div><h2 class="display">${type==='dynasty'?'DYNASTY POWER RANKINGS':'2026 POWER RANKINGS'}</h2><p class="muted">${esc(r.intro||'')}</p></div><div><div class="eyebrow mono">${r.updated?'LAST UPDATED '+dateFmt(r.updated):'AWAITING FIRST EDITION'}</div></div></div>${entries.length?`<div class="rank-table">${entries.map((e,i)=>`<div class="ranking-line"><div class="rank-number">${String(i+1).padStart(2,'0')}</div><div class="team-info"><div class="team-name-initial">${esc(initials(e.team))}</div><div><div class="rank-team-name">${esc(e.team)}</div><div class="rank-owner">${esc(data.teams.find(t=>t.name===e.team)?.owner||e.record||'')}</div></div></div><div class="rank-blurb">${esc(e.blurb||'No notes yet.')}</div><div class="trend ${e.trend==='Down'?'down':''}">${esc(e.trend||'—')}</div></div>`).join('')}</div>`:emptyBox('NO RANKINGS PUBLISHED YET','Start by adding the league’s teams, then build your first ranking in the Commissioner Studio.','rankings')}
<div class="tip" style="margin-top:24px">Rankings are editorial opinions — not automatically generated from fantasy platform scores. You control the order, movement and commentary.</div></main>`}
function pageTop(kicker,title,desc){return `<section class="page-top"><div class="wrap"><div class="eyebrow mono">${esc(kicker)}</div><h1 class="display">${esc(title)}</h1><p>${esc(desc)}</p></div></section>`}
function emptyBox(title,desc,tab){return `<div class="empty-state"><div class="empty-state-icon">✳</div><h3>${esc(title)}</h3><p>${esc(desc)}</p><button class="btn dark" data-action="open-studio" data-studio-tab="${tab}">Open Commissioner Studio ↗</button></div>`}
function allTime(){const byTeam={};for(const s of data.seasons){const winners=Array.isArray(s.coChampions)&&s.coChampions.length?s.coChampions:(s.champion?[s.champion]:[]);for(const t of winners){byTeam[t]??={team:t,titles:0,finals:0,w:0,l:0,pf:0,seasons:0};byTeam[t].titles++;byTeam[t].finals++}if(s.runnerUp&&!winners.includes(s.runnerUp)){const t=s.runnerUp;byTeam[t]??={team:t,titles:0,finals:0,w:0,l:0,pf:0,seasons:0};byTeam[t].finals++}for(const st of (s.standings||[])){byTeam[st.team]??={team:st.team,titles:0,finals:0,w:0,l:0,pf:0,seasons:0};byTeam[st.team].w+=Number(st.w)||0;byTeam[st.team].l+=Number(st.l)||0;byTeam[st.team].pf+=Number(st.pf)||0;byTeam[st.team].seasons++}}return Object.values(byTeam).sort((a,b)=>b.titles-a.titles||b.finals-a.finals||b.w-a.w||a.team.localeCompare(b.team))}
function history(){const selected=state.historyYear,years=data.seasons.slice().sort((a,b)=>b.year-a.year),championships=data.seasons.filter(s=>s.champion),all=allTime(),s=selected!=='all'?data.seasons.find(x=>String(x.year)===selected):null;const yrs=years.map(x=>`<button class="${selected===String(x.year)?'active':''}" data-action="history-year" data-year="${x.year}">${x.year}</button>`).join('');const most=all[0]?.titles?all[0]:null;
return `${pageTop('03 / ALL-TIME LEGACY','THE 201 ARCHIVE',`A running record of everything that matters, from ${data.settings.founded} to the present.`)}<main class="main wrap"><div class="hist-controls"><div class="year-pills"><button class="${selected==='all'?'active':''}" data-action="history-year" data-year="all">ALL TIME</button>${yrs}</div><button class="section-link" data-action="open-studio" data-studio-tab="history">Update records ↗</button></div>${s?seasonPage(s):`<div class="history-summary"><div class="history-highlight"><div class="eyebrow mono">Seasons tracked</div><div class="value">${years.length}</div><div class="muted">${esc(data.settings.founded)}–${CURRENT_YEAR}</div></div><div class="history-highlight"><div class="eyebrow mono">Title seasons recorded</div><div class="value">${championships.length||'—'}</div><div class="muted">Historical results from the supplied 2025 presentation</div></div><div class="history-highlight"><div class="eyebrow mono">Most championships</div><div class="value">${most?esc(most.titles):'—'}</div><div class="muted">${most?esc(most.team):'Awaiting league data'}</div></div></div><div class="section-heading"><div><div class="eyebrow mono">Championship ledger</div><h2 class="display">YEAR BY YEAR</h2></div></div><div class="timeline">${years.map(y=>`<div class="timeline-row"><div class="yr">${y.year}</div><div><div class="eyebrow mono">Champion</div><div class="archive-team">${esc(y.champion||'Awaiting result')}</div></div><div class="runner">${y.coChampions?.length?'Co-champions · shared title':y.runnerUp?'Runner-up: '+esc(y.runnerUp):y.year===2026?'Season in progress':'No runner-up recorded'}</div><button aria-label="View season ${y.year}" data-action="history-year" data-year="${y.year}">↗</button></div>`).join('')}</div><div class="section-space"><div class="section-heading"><div><div class="eyebrow mono">Calculated from recorded results</div><h2 class="display">ALL-TIME LEADERBOARD</h2></div></div>${all.length?`<div class="table-scroller"><table class="league-table"><thead><tr><th>Franchise</th><th>Titles</th><th>Finals</th><th>Wins</th><th>Losses</th><th>Win %</th></tr></thead><tbody>${all.map(t=>`<tr><td>${esc(t.team)}</td><td>${t.titles}</td><td>${t.finals}</td><td>${t.seasons?t.w:'—'}</td><td>${t.seasons?t.l:'—'}</td><td>${t.w+t.l?((t.w/(t.w+t.l))*100).toFixed(1)+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('THE RECORD BOOK IS READY','Add past champions and season standings. This leaderboard will build itself as the historical data comes in.','history')}</div><div class="section-space"><div class="section-heading"><div><div class="eyebrow mono">The numbers that built the legend</div><h2 class="display">THE RECORD BOOK</h2><div class="heading-sub">Career superlatives and scoring records from the 2025 league presentation.</div></div></div><div class="records-grid">${(data.customRecords||[]).map((r,i)=>`<div class="record-card"><div class="record-label mono">${esc(r.label)}</div><div class="record-value">${esc(r.value)}</div><div class="record-holder">${esc(r.holder)}</div><div class="record-note">${esc(r.note||'')}</div></div>`).join('')}</div><div class="archive-source">ARCHIVAL SNAPSHOT: These career records reflect the 2025 presentation and have not been updated with the 2025 or 2026 seasons. Complete game-by-game standings were not included in that presentation, so win/loss leaderboard fields will populate as additional data is entered.</div></div><div class="section-space"><div class="section-heading"><div><div class="eyebrow mono">The 2024 Hoggies</div><h2 class="display">HALL OF HOGS</h2></div></div><div class="awards-grid">${(data.awards||[]).map(a=>`<div class="award-card"><div class="award-icon">★</div><div><div class="eyebrow mono">${esc(a.year)} · ${esc(a.name)}</div><h3>${esc(a.winner)}</h3><div class="muted">Award winner</div></div></div>`).join('')}</div></div>`}</main>`}
function seasonPage(s){return `<div class="year-hero-card"><div><div class="eyebrow mono">A chapter in league history</div><h2 class="display">THE ${s.year} SEASON</h2></div><div style="text-align:right"><div class="eyebrow mono">${s.champion?'TITLE AWARDED':s.year===CURRENT_YEAR?'CURRENT SEASON':'ARCHIVE PENDING'}</div><div style="font:800 36px 'Barlow Condensed';color:var(--lime)">${s.champion?'🏆':'—'}</div></div></div><div class="year-result-grid">${[['Champion',s.champion],['Runner-up',s.coChampions?.length?'Shared title (no runner-up)':s.runnerUp],['Regular-season winner',s.regularSeason],['High-point scorer',s.highestPoints]].map(v=>`<div class="year-result"><div class="eyebrow mono">${v[0]}</div><div class="value">${esc(v[1]||'Not entered')}</div></div>`).join('')}</div>${s.notes?`<div class="section-heading"><div><div class="eyebrow mono">The story of the season</div><h2 class="display">SEASON NOTES</h2></div></div><div class="history-notes">${esc(s.notes)}</div>`:''}<div class="section-heading"><div><div class="eyebrow mono">The complete  ${s.year} field</div><h2 class="display">FINAL STANDINGS</h2></div></div>${(s.standings||[]).length?`<div class="table-scroller"><table class="league-table"><thead><tr><th>Team</th><th>W</th><th>L</th><th>Points for</th><th>Finish</th></tr></thead><tbody>${s.standings.map(t=>`<tr><td>${esc(t.team)}</td><td>${esc(t.w)}</td><td>${esc(t.l)}</td><td>${nf(t.pf)}</td><td>${esc(t.finish)}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('STANDINGS NOT ENTERED','The season is ready for results. Use the editor to enter this year’s standings and story.','history')}<button class="section-link" style="margin-top:28px" data-action="history-year" data-year="all">← Back to full archive</button>`}
function footer(){return `<footer class="footer"><div class="wrap"><div class="footer-main"><div><div class="eyebrow mono" style="color:var(--lime)">The official record</div><div class="display">${esc(data.settings.name)}</div><p>Every season has a story. Make sure the good ones — and the embarrassing ones — don't get forgotten.</p></div><div><div class="eyebrow mono" style="color:var(--lime)">Navigation</div><div style="display:flex;gap:18px;margin-top:17px;flex-wrap:wrap"><button class="section-link" style="color:#fff;border-color:#566658" data-action="nav" data-page="home">Home</button><button class="section-link" style="color:#fff;border-color:#566658" data-action="nav" data-page="rankings">Rankings</button><button class="section-link" style="color:#fff;border-color:#566658" data-action="nav" data-page="history">History</button><button class="section-link" style="color:#fff;border-color:#566658" data-action="nav" data-page="owners">Owners Hall</button><button class="section-link" style="color:#fff;border-color:#566658" data-action="nav" data-page="countdown">201 Countdown</button></div></div></div><div class="footer-bottom mono"><span>© ${CURRENT_YEAR} ${esc(data.settings.name)}.  EST. ${esc(data.settings.founded)}.</span><span>BUILT FOR THE GROUP CHAT. PRESERVED FOR HISTORY.</span></div></div></footer>`}
function articleDialog(){const a=data.articles.find(x=>x.id===state.articleId);if(!a)return '';return `<div class="overlay" data-action="close-article-overlay"><article class="dialog article-reader" role="dialog" aria-modal="true" aria-label="Article"><div class="dialog-header"><div class="display">THE NEWSROOM</div><button class="close-btn" aria-label="Close article" data-action="close-article">×</button></div><div class="dialog-body"><div class="eyebrow mono">${esc(a.category)} / THE LEAGUE</div><h2>${esc(a.title)}</h2><div class="byline mono">BY ${esc(a.author)} • ${dateFmt(a.date)}</div>${a.image?`<img src="${esc(a.image)}" class="article-image" alt="Article cover" />`:''}${String(a.body||'').split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}</div></article></div>`}
function studio(){return `<div class="overlay" data-action="close-studio-overlay"><section class="dialog" role="dialog" aria-modal="true" aria-label="Commissioner Studio"><div class="dialog-header"><div><div class="eyebrow mono" style="color:var(--lime)">LOCAL EDITING / COMMISSIONER TOOLS</div><div class="display">COMMISSIONER STUDIO</div></div><button class="close-btn" data-action="close-studio" aria-label="Close editor">×</button></div><div class="dialog-body"><div class="studio-layout"><div class="studio-menu">${[['settings','Site settings'],['teams','Teams'],['articles','Articles'],['rankings','Rankings'],['history','History'],['owners','Owner sprites'],['videos','Weekly video'],['data','Publish / Backup']].map(x=>`<button class="${state.studioTab===x[0]?'active':''}" data-action="studio-tab" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div><div class="studio-content" id="studio-content">${studioContent()}</div></div></div></section></div>`}

// Sleeper integration: read-only public API. Data is only published when user exports the updated site.
const SLEEPER_ID='1352473165539864576';
const SLEEPER_API='https://api.sleeper.app/v1';
let sleeperBusy=false;
async function sleeperGet(path){
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),18000);
 try {const r=await fetch(SLEEPER_API+path,{signal:controller.signal});if(!r.ok)throw Error('Sleeper API '+r.status+' for '+path);return await r.json();}
 finally{clearTimeout(timer)}
}
function sleeperTeamName(roster,users){const u=users.find(x=>String(x.user_id)===String(roster.owner_id));return u?.metadata?.team_name||roster.metadata?.team_name||u?.display_name||('Roster '+roster.roster_id)}
function clamp(v){return Number.isFinite(v)?v:0}
function makeSleeperSnapshot(league,users,rosters,nfl,weeks,nextMatchups,tradedPicks){
 const season=Number(league.season);
 const num=Object.keys(weeks).map(Number).sort((a,b)=>a-b);
 const summaries=rosters.map(r=>{const name=sleeperTeamName(r,users),rs=r.settings||{};const rid=Number(r.roster_id);
  const games=num.flatMap(w=>{const m=(weeks[w]||[]).find(x=>Number(x.roster_id)===rid);return m&&typeof m.points==='number'?[{week:w,points:Number(m.custom_points??m.points),matchup:m.matchup_id}]:[]});
  const pf=Number(rs.fpts||0)+Number(rs.fpts_decimal||0)/100;
  return {rosterId:rid,userId:String(r.owner_id||''),name,owner:users.find(u=>String(u.user_id)===String(r.owner_id))?.display_name||'',wins:Number(rs.wins||0),losses:Number(rs.losses||0),ties:Number(rs.ties||0),pf:pf||games.reduce((a,b)=>a+b.points,0),pa:Number(rs.fpts_against||0)+Number(rs.fpts_against_decimal||0)/100,ppg:games.length?games.reduce((a,b)=>a+b.points,0)/games.length:0,recentPpg:games.length?games.slice(-3).reduce((a,b)=>a+b.points,0)/Math.min(3,games.length):0, games,players:Array.isArray(r.players)?r.players:[],starters:Array.isArray(r.starters)?r.starters:[],taxi:Array.isArray(r.taxi)?r.taxi:[],reserve:Array.isArray(r.reserve)?r.reserve:[],record:''};
 });
 for(const x of summaries){const total=x.wins+x.losses+x.ties;x.record=`${x.wins}-${x.losses}${x.ties?'-'+x.ties:''}`;x.winPct=total?(x.wins+0.5*x.ties)/total:0;x.allPlayWins=0;x.allPlayGames=0;
  for(const g of x.games){const peers=summaries.map(z=>z.games.find(v=>v.week===g.week)).filter(Boolean);for(const v of peers){if(v===g)continue;x.allPlayWins+=g.points>v.points?1:g.points===v.points?.5:0;x.allPlayGames++;}}
  x.allPlayPct=x.allPlayGames?x.allPlayWins/x.allPlayGames:0;
 }
 const normalize=key=>{const a=summaries.map(x=>x[key]),min=Math.min(...a),max=Math.max(...a);return x=>max===min?.5:(x-min)/(max-min)};
 const nppg=normalize('ppg'),nap=normalize('allPlayPct'),nr=normalize('recentPpg'),nw=normalize('winPct');
 for(const x of summaries){x.powerScore=+((.40*nppg(x.ppg)+.25*nap(x.allPlayPct)+.20*nr(x.recentPpg)+.15*nw(x.winPct))*100).toFixed(1);x.trendPpg=+(x.recentPpg-x.ppg).toFixed(1)}
 summaries.sort((a,b)=>b.powerScore-a.powerScore||b.ppg-a.ppg);
 const next=[];const groups={};for(const m of nextMatchups||[]){if(m.matchup_id===null||m.matchup_id===undefined)continue;(groups[m.matchup_id]??=[]).push(m)}
 for(const [id,grp] of Object.entries(groups)){if(grp.length!==2)continue;const a=summaries.find(x=>x.rosterId===Number(grp[0].roster_id)),b=summaries.find(x=>x.rosterId===Number(grp[1].roster_id));if(a&&b)next.push({matchupId:id,teamA:a.name,teamB:b.name,aId:a.rosterId,bId:b.rosterId,combinedScore:+(a.powerScore+b.powerScore).toFixed(1)})}
 next.sort((a,b)=>b.combinedScore-a.combinedScore);
 const result={leagueId:String(league.league_id),leagueName:league.name||'The 201 Invitational',season:season,status:league.status,syncedAt:new Date().toISOString(),lastCompletedWeek:num.at(-1)||0,nextWeek:num.length?num.at(-1)+1:Number(nfl.week)||1,teamCount:rosters.length,settings:league.settings||{},scoring:league.scoring_settings||{},rosterPositions:league.roster_positions||[],previousLeagueId:league.previous_league_id||null,standings:summaries,nextMatchups:next,tradedPicks:tradedPicks||[],source:'Sleeper public API',method:'Power score = 40% season PPG + 25% all-play wins + 20% last-three PPG + 15% official winning percentage. Each metric normalized against the current league.'};
 return result;
}
async function fetchSleeperData(){
 if(sleeperBusy)return;sleeperBusy=true;toast('Contacting Sleeper. Fetching settings, rosters and weekly results…');
 try{
 const [league,users,rosters,nfl]=await Promise.all([sleeperGet('/league/'+SLEEPER_ID),sleeperGet('/league/'+SLEEPER_ID+'/users'),sleeperGet('/league/'+SLEEPER_ID+'/rosters'),sleeperGet('/state/nfl')]);
 if(!league||!league.league_id||!Array.isArray(users)||!Array.isArray(rosters))throw Error('Incomplete league response');
 // Only finished weeks are ranked; current-week live scores must not bias rankings.
 const maxCompleted=(String(nfl.season)===String(league.season))?Math.max(0,Number(nfl.week||1)-1):league.status==='complete'?17:0;
 const maxWeek=Math.min(18,maxCompleted);const weeks={};
 const res=await Promise.all(Array.from({length:maxWeek},(_,i)=>sleeperGet('/league/'+SLEEPER_ID+'/matchups/'+(i+1))));
 res.forEach((value,i)=>{weeks[i+1]=value||[]});
 const nextWeek=Math.min(maxWeek+1,18);
 const [nextResult,picksResult]=await Promise.allSettled([sleeperGet('/league/'+SLEEPER_ID+'/matchups/'+nextWeek),sleeperGet('/league/'+SLEEPER_ID+'/traded_picks')]);
 const latest=makeSleeperSnapshot(league,users,rosters,nfl,weeks,nextResult.status==='fulfilled'?nextResult.value:[],picksResult.status==='fulfilled'?picksResult.value:[]);
 importSleeperSnapshot(latest);toast('Sleeper sync complete. '+latest.teamCount+' teams; '+latest.lastCompletedWeek+' completed weeks.');
 }catch(e){toast('Could not connect: '+(e.message||'Network error'));alert('Sleeper sync could not complete. '+(e.message||'Network error')+'\n\nIf you are using a restricted browser or network, run the included sleeper_sync.py and import its JSON instead.');}
 finally{sleeperBusy=false}
}
function importSleeperSnapshot(snapshot){
 if(String(snapshot.leagueId)!==SLEEPER_ID||!Array.isArray(snapshot.standings)||!snapshot.scoring)throw Error('Invalid Sleeper league snapshot');
 data.sleeper=snapshot;
 const old=data.rankings.season2026.entries.slice(),oldPos=new Map(old.map((e,i)=>[e.team,i+1]));
 data.teams=snapshot.standings.map(t=>({name:t.name,owner:t.owner,rosterId:t.rosterId,userId:t.userId}));
 data.rankings.season2026={updated:snapshot.syncedAt.slice(0,10),intro:'Objective performance index through Week '+snapshot.lastCompletedWeek+'. '+snapshot.method,entries:snapshot.standings.map((t,i)=>({id:'sleeper-'+t.rosterId,team:t.name,record:t.record,trend:!oldPos.has(t.name)?'New':oldPos.get(t.name)>i+1?'Up':oldPos.get(t.name)<i+1?'Down':'Same',blurb:'Power score '+t.powerScore+' / 100. '+t.ppg.toFixed(1)+' PPG; '+Math.round(100*t.allPlayPct)+'% all-play rate; '+t.recentPpg.toFixed(1)+' PPG over last three weeks.'}))};
 save();render();
}
function sleeperDrafts(){const s=data.sleeper;if(!s||s.lastCompletedWeek<1){toast('Sync completed weekly scores before generating drafts.');return}
 const date=new Date().toISOString().slice(0,10),byId=new Map(s.standings.map(x=>[x.rosterId,x]));
 const up=s.standings.slice().sort((a,b)=>b.trendPpg-a.trendPpg).at(0),down=s.standings.slice().sort((a,b)=>a.trendPpg-b.trendPpg).find(t=>t.rosterId!==up?.rosterId);
 const m=s.nextMatchups[0]; const make=(id,title,category,excerpt,body)=>({id:'weekly-'+s.season+'-'+s.lastCompletedWeek+'-'+id,title,category,excerpt,body,author:'The 201 Newsroom',date,published:false,image:''});
 const drafts=[];
 if(m){const a=byId.get(m.aId),b=byId.get(m.bId);drafts.push(make('matchup','Matchup of the Week: '+a.name+' vs. '+b.name,'Matchup of the Week','Two of the league’s strongest teams collide in Week '+s.nextWeek+'.',`WEEK ${s.nextWeek} MATCHUP PREVIEW\n\n${a.name} (${a.record}, ${a.ppg.toFixed(1)} points per game) faces ${b.name} (${b.record}, ${b.ppg.toFixed(1)} PPG).\n\nThis matchup was selected using the combined performance rankings of both teams, not name recognition. ${a.name} enters with a power score of ${a.powerScore}, compared with ${b.powerScore} for ${b.name}.\n\nWHAT TO WATCH\n\n${a.name} has averaged ${a.recentPpg.toFixed(1)} points over its last three games; ${b.name} has averaged ${b.recentPpg.toFixed(1)}.\n\nEDITORIAL TODO: Add lineup news, injuries, rivalry history, and a prediction after reviewing starting rosters. These details are not inferred from Sleeper scores.`))}
 if(up&&down)drafts.push(make('stock','Stock Watch: '+up.name+' Rises, '+down.name+' Slides','Stock Watch',`Recent scoring trends put ${up.name} on the upswing and ${down.name} under the microscope.`,`THE RISER — ${up.name}\n\n${up.name} has scored ${up.recentPpg.toFixed(1)} points per game over the last three weeks versus a ${up.ppg.toFixed(1)}-point season average, a difference of ${up.trendPpg>0?'+':''}${up.trendPpg.toFixed(1)}. Official record: ${up.record}.\n\nTHE FALLER — ${down.name}\n\n${down.name} is averaging ${down.recentPpg.toFixed(1)} points over the past three weeks versus ${down.ppg.toFixed(1)} for the season, a difference of ${down.trendPpg>0?'+':''}${down.trendPpg.toFixed(1)}. Official record: ${down.record}.\n\nEDITORIAL TODO: Add verified injuries, trades, roster changes and future outlook. 'Rising' and 'falling' here reflect recent scoring trend only.`));
 drafts.push(make('rankings','The 201 Power Rankings — After Week '+s.lastCompletedWeek,'Power Rankings',`Who is actually playing the best football in the 201 Invitational?`,s.standings.map((t,i)=>`${i+1}. ${t.name} (${t.record}) — ${t.powerScore}/100\n${t.ppg.toFixed(1)} season PPG · ${t.recentPpg.toFixed(1)} last-three PPG · ${(100*t.allPlayPct).toFixed(0)}% all-play win rate`).join('\n\n')+'\n\nMETHOD: '+s.method));
 let n=0;for(const a of drafts){const j=data.articles.findIndex(x=>x.id===a.id);if(j>=0){if(data.articles[j].published)continue;data.articles[j]=a}else data.articles.push(a);n++}
 save();state.studio=true;state.studioTab='articles';render();toast('Generated '+n+' editable, unpublished draft(s). Review before publishing.');
}

const historicalNames=()=>[...new Set(data.seasons.flatMap(s=>[...(Array.isArray(s.coChampions)?s.coChampions:(s.champion?[s.champion]:[])),s.runnerUp].filter(Boolean)))].sort();

function verifiedOwnerData(owner){const canonical=data.ownerAliases[owner.id]||owner.name;const titles=[],finals=[],seasonsWithStanding=[];let wins=0,losses=0,points=0,thirds=0;
 for(const s of data.seasons){let winners=Array.isArray(s.coChampions)&&s.coChampions.length?s.coChampions:(s.champion?[s.champion]:[]);if(winners.includes(canonical)){titles.push(s.year);finals.push({year:s.year,finish:'Champion'});}else if(s.runnerUp===canonical)finals.push({year:s.year,finish:'Runner-up'});
  const st=(s.standings||[]).find(x=>x.team===canonical);if(st){seasonsWithStanding.push(s.year);wins+=Number(st.w)||0;losses+=Number(st.l)||0;points+=Number(st.pf)||0;if(/^(3|3rd|third)\b/i.test(String(st.finish||'')))thirds++;}}
 const allPodiumYears=new Set([...finals.map(x=>x.year),...data.seasons.flatMap(s=>(s.standings||[]).filter(x=>x.team===canonical && /^(3|3rd|third)\b/i.test(String(x.finish||''))).map(x=>x.year))]);
 return {canonical,titles,finals,podium:allPodiumYears.size,hasAllPodiums:seasonsWithStanding.length===data.seasons.filter(s=>s.champion).length,thirds,wins,losses,points,seasonsWithStanding};

function portrait(owner){const im=data.ownerSprites[owner.id];return im?`<img src="${esc(im)}" alt="Pixel art portrait of ${esc(owner.name)}">`:`<div class="owner-fallback" aria-label="Pixel portrait pending">${esc(owner.placeholder?'?':initials(owner.name))}</div>`}
function ownersHall(){const list=ownersList();return `${pageTop('05 / THE OWNERS','THE OWNERS HALL','Twelve franchises. Fourteen seasons of history. An interactive record of the personalities who built this league.')}
 <main class="main wrap"><div class="section-heading"><div><div class="eyebrow mono">Choose a manager</div><h2 class="display">MEET THE <span>LEGENDS</span></h2><p class="heading-sub">Tap a card to open championships, appearances in the final, verified career stats and historical notes. Portrait sprites can be added after owner photos are supplied.</p></div></div>
 <div class="owner-grid">${list.map((o,i)=>{const c=verifiedOwnerData(o);return `<button class="owner-card" data-action="owner-profile" data-owner-id="${esc(o.id)}"><div class="owner-art">${portrait(o)}</div><div class="owner-info"><div class="eyebrow mono">MANAGER ${String(i+1).padStart(2,'0')}</div><h3>${esc(o.name)}</h3><div class="owner-sub">${esc(o.team)}</div><div class="owner-foot"><span>${o.placeholder?'PORTRAIT PENDING':c.titles.length+' VERIFIED TITLE'+(c.titles.length===1?'':'S')}</span><span>VIEW PROFILE ↗</span></div></div></button>`}).join('')}</div>
 <div class="tip" style="margin-top:23px">Only championship and runner-up data through 2024 are fully documented. Career win/loss totals, third-place finishes and full season records are not yet complete. Portraits shown as placeholders until actual owner photos are provided.</div></main>`}
function ownerDialog(){const o=ownersList().find(x=>x.id===state.ownerId);if(!o)return '';const v=verifiedOwnerData(o),bio=data.ownerBios[o.id]||'';return `<div class="overlay" data-action="close-owner-overlay"><article class="dialog owner-reader" role="dialog" aria-modal="true" aria-label="Owner profile"><div class="dialog-header"><div><div class="eyebrow mono" style="color:var(--lime)">THE 201 OWNER HALL</div><div class="display">MANAGER PROFILE</div></div><button class="close-btn" data-action="close-owner" aria-label="Close owner profile">×</button></div><div class="owner-reader-body"><div class="owner-profile-top"><div>${data.ownerSprites[o.id]?`<img class="profile-sprite" src="${esc(data.ownerSprites[o.id])}" alt="Pixel sprite">`:`<div class="profile-fallback">${esc(o.placeholder?'?':initials(o.name))}</div>`}</div><div><div class="eyebrow mono">${esc(o.team)}</div><h2 class="display" style="font-size:44px">${esc(o.name)}</h2><p class="muted">Historical archive matched to: ${esc(v.canonical)}</p></div></div><div class="owner-feature-grid"><div class="owner-feature"><b>${v.titles.length}</b><span>Verified titles</span></div><div class="owner-feature"><b>${v.finals.length}</b><span>Final appearances</span></div><div class="owner-feature"><b>${v.hasAllPodiums?v.podium:'—'}</b><span>Top-3 finishes${v.hasAllPodiums?'':'*'}</span></div></div>${bio?`<p style="line-height:1.8">${esc(bio)}</p>`:''}
 <div class="owner-chronicle"><h3>CHAMPIONSHIP TIMELINE</h3>${v.finals.length?`<ul>${v.finals.slice().sort((a,b)=>b.year-a.year).map(x=>`<li><strong>${x.year}:</strong> ${esc(x.finish)}</li>`).join('')}</ul>`:'<p class="muted">No recorded championship or runner-up finishes matched to this manager yet.</p>'}<p class="muted" style="margin-top:18px;font-size:11px">* Full top-3 totals require third-place results for every season. A dash means the historical record is incomplete, not zero. Career wins and points will appear after historical standings are entered and ownership identities are matched.</p></div></div></article></div>`}
function showScript(){
 const s=data.sleeper;
 if(!s?.lastResults?.length) return 'THE 201 WEEKLY WRAP-UP — RESULTS RECAP\n\nSync a completed Sleeper week to generate a rundown of all matchups.\nScores are not available yet.';
 const games=s.lastResults;
 const close=games.slice().sort((a,b)=>Math.abs(a.pointsA-a.pointsB)-Math.abs(b.pointsA-b.pointsB))[0];
 const blowout=games.slice().sort((a,b)=>Math.abs(b.pointsA-b.pointsB)-Math.abs(a.pointsA-a.pointsB))[0];
 const recaps=games.map((g,i)=>{
  const score=(n)=>Number(n).toFixed(2).replace(/\.00$/,'');
  const tied=g.pointsA===g.pointsB;
  const winner=tied?'A TIE':g.pointsA>g.pointsB?g.teamA:g.teamB;
  const loser=tied?'':g.pointsA>g.pointsB?g.teamB:g.teamA;
  const high=tied?score(g.pointsA):score(Math.max(g.pointsA,g.pointsB));
  const low=tied?score(g.pointsB):score(Math.min(g.pointsA,g.pointsB));
  return 'MATCHUP '+(i+1)+': '+(tied?g.teamA+' and '+g.teamB+' tie it '+high+'–'+low:winner+' beats '+loser+' '+high+'–'+low)+'.';
 }).join('\n');
 return `THE 201 WEEKLY WRAP-UP — WEEK ${s.lastCompletedWeek} FINAL RESULTS\n\n[OPEN] Welcome to The 201 Invitational! Six battles, twelve teams, zero mercy.\n\n[THE SCOREBOARD]\n${recaps}\n\n[CLOSEST GAME] ${close.teamA} versus ${close.teamB} — decided by ${Math.abs(close.pointsA-close.pointsB).toFixed(2)} points.\n[BIGGEST MARGIN] ${blowout.teamA} versus ${blowout.teamB}, separated by ${Math.abs(blowout.pointsA-blowout.pointsB).toFixed(2)}.\n\n[SIGN-OFF] That's another week in The 201. The receipts are permanent!\n\nPRODUCER NOTE: This is a factual score rundown, not an automatically rendered video. Review Sleeper finals, add original jokes, check the pronunciation of team names and record with a distinct original announcer voice. Video runtime depends on narration speed.`;
}
function safeVideoEmbed(url){try{const u=new URL(url),host=u.hostname.replace(/^www\./,'');let id='';if(host==='youtube.com'&&u.pathname==='/watch')id=u.searchParams.get('v');else if(host==='youtu.be')id=u.pathname.slice(1);if(!id||!/^[a-zA-Z0-9_-]{6,}$/.test(id))return '';return `https://www.youtube-nocookie.com/embed/${id}`;}catch(e){return ''}}
function countdown(){let latest=(data.videoEpisodes||[]).filter(e=>safeVideoEmbed(e.url)).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];return `${pageTop('06 / THE WEEKLY SHOW','THE 201 WEEKLY WRAP-UP','Every result. Every rivalry. Every receipt.')}
 <main class="main wrap"><section class="show-hero"><div><div class="eyebrow mono" style="color:var(--lime)">Weekly recap desk / After the final matchup</div><h3>THE <span>201</span><br>WRAP-UP</h3><p>A quick original football highlight show recapping every result, the closest finish, the biggest blowout, and the week’s biggest surprise. No impersonation or cloned commentator voice.</p></div><div class="show-timer"><b>:90</b><small>SECONDS</small></div></section>
 <section class="section-space"><div class="section-heading"><div><div class="eyebrow mono">The format</div><h2 class="display">EVERY SCORE, <span>NO HUDDLE</span></h2></div></div><div class="show-segments">${[['00–08','THE OPEN','Original sports-show intro'],['08–70','ALL SIX RESULTS','Every final score and winning owner'],['70–85','THE DRAMA','Closest finish and biggest margin'],['85–90','THE SIGN-OFF','The receipts are permanent']].map(x=>`<div class="show-segment"><div class="eyebrow mono">${x[0]} seconds</div><b>${x[1]}</b><p>${x[2]}</p></div>`).join('')}</div></section>
 ${latest?`<section class="section-space"><div class="section-heading"><div><div class="eyebrow mono">Latest video / ${esc(latest.date||'')}</div><h2 class="display">${esc(latest.title||'LATEST EPISODE')}</h2></div></div><div class="video-embed"><iframe loading="lazy" title="The 201 Weekly Wrap-Up video" src="${esc(safeVideoEmbed(latest.url))}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div></section>`:'<div class="tip" style="margin-top:23px">Episode player coming soon: add a YouTube link through Commissioner Studio after your first video has been produced.</div>'}
 <section class="section-space"><div class="section-heading"><div><div class="eyebrow mono">Production desk</div><h2 class="display">WEEKLY <span>SCRIPT</span></h2><p class="heading-sub">Based on verified Sleeper data when available. Designed for an energetic original narrator, not a specific broadcaster’s likeness or voice.</p></div></div><div class="script-box"><pre id="show-script">${esc(showScript())}</pre><button class="btn dark" data-action="download-script">Download script ↗</button></div></section></main>`}

function sleeperHub(){const s=data.sleeper;
 const scoreRow=s?`<div class="history-summary"><div class="history-highlight"><div class="eyebrow mono">League season</div><div class="value">${esc(s.season)}</div><div class="muted">${esc(s.leagueName)}</div></div><div class="history-highlight"><div class="eyebrow mono">Teams connected</div><div class="value">${s.teamCount}</div><div class="muted">Via Sleeper API</div></div><div class="history-highlight"><div class="eyebrow mono">Completed weeks</div><div class="value">${s.lastCompletedWeek}</div><div class="muted">Synced ${esc(s.syncedAt.slice(0,16).replace('T',' '))} UTC</div></div></div>`:'';
 const rosterMap={QB:'Quarterback',RB:'Running back',WR:'Wide receiver',TE:'Tight end',FLEX:'Flex',SUPER_FLEX:'Superflex',K:'Kicker',DEF:'Defense',BN:'Bench',IR:'IR',TAXI:'Taxi'};
 const counts={};if(s)for(const x of s.rosterPositions)counts[x]=(counts[x]||0)+1;
 const scoreLabels={rec:'Reception',pass_td:'Passing TD',pass_yd:'Passing yard',pass_int:'Interception',rush_td:'Rushing TD',rush_yd:'Rushing yard',rec_td:'Receiving TD',rec_yd:'Receiving yard',fum_lost:'Fumble lost'};
 const rank=s?s.standings:[];
 return `${pageTop('04 / THE DATA DESK','SLEEPER LIVE HUB','Read-only data from the Sleeper API. The source of truth for the weekly edition.')}
 <main class="main wrap"><div class="section-heading"><div><div class="eyebrow mono">Connect your league</div><h2 class="display">THE 201 <span>DATA DESK</span></h2><p class="heading-sub">League ID: ${SLEEPER_ID} · Data refreshes only when you click Sync, unless an automated publisher is configured.</p></div></div>
 <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px"><button class="btn" data-action="sleeper-sync">↻ Sync Sleeper now</button><button class="btn dark" data-action="sleeper-import">Import snapshot JSON</button><input type="file" id="sleeper-json" accept=".json,application/json" style="display:none"><a href="https://sleeper.com/leagues/${SLEEPER_ID}" target="_blank" rel="noopener" class="btn dark">Open in Sleeper ↗</a>${s?'<button class="btn dark" data-action="sleeper-drafts">Generate weekly article drafts →</button>':''}</div>
 ${s?scoreRow:`<div class="empty-state"><h3>League not synced yet</h3><p>Click Sync Sleeper to load the actual 2026 scoring rules, rosters and completed weekly matchups. No current records or rankings are fabricated. If this browser blocks API requests, use the included Python sync script and import its JSON.</p></div>`}
 ${s?`<div class="section-space"><div class="section-heading"><div><div class="eyebrow mono">Source-verified</div><h2 class="display">LEAGUE <span>SETTINGS</span></h2></div></div><div class="rank-home-grid"><div class="rank-teaser" style="padding:24px;min-height:0"><h3 class="display" style="font-size:29px">ROSTER POSITIONS</h3><div style="margin-top:12px;line-height:2">${Object.entries(counts).map(([key,value])=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line)"><span>${esc(rosterMap[key]||key)}</span><strong>${value}</strong></div>`).join('')}</div></div><div class="rank-teaser" style="padding:24px;min-height:0"><h3 class="display" style="font-size:29px">SCORING</h3><div style="margin-top:12px;line-height:2">${Object.entries(s.scoring).filter(([k])=>scoreLabels[k]).map(([key,value])=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--line)"><span>${esc(scoreLabels[key])}</span><strong>${esc(value)}</strong></div>`).join('')}</div></div></div><details style="margin-top:17px"><summary style="cursor:pointer;font-weight:700">Full league settings (raw values from Sleeper)</summary><pre style="white-space:pre-wrap;background:white;padding:22px;border:1px solid var(--line);font-size:11px;overflow:auto">${esc(JSON.stringify({settings:s.settings,scoring:s.scoring,rosterPositions:s.rosterPositions},null,2))}</pre></details></div>
 <div class="section-space"><div class="section-heading"><div><div class="eyebrow mono">2026 / through Week ${s.lastCompletedWeek}</div><h2 class="display">PERFORMANCE <span>RANKINGS</span></h2><p class="heading-sub">${esc(s.method)} These are team-performance rankings, not player-projection or dynasty rankings.</p></div></div><div class="rank-table">${rank.map((t,i)=>`<div class="ranking-row"><div class="ranking-number">${i+1}</div><div class="ranking-team"><strong>${esc(t.name)}</strong><div class="muted">${esc(t.owner)}</div></div><div class="ranking-record">${esc(t.record)} · ${t.ppg.toFixed(1)} PPG</div><div class="ranking-score" style="font-size:20px;font-weight:800">${t.powerScore}</div></div>`).join('')}</div></div>
 <div class="section-space"><div class="section-heading"><div><div class="eyebrow mono">Week ${s.nextWeek} / upcoming matchups</div><h2 class="display">MATCHUP <span>RADAR</span></h2></div></div><div class="studio-list">${s.nextMatchups.length?s.nextMatchups.map((m,i)=>`<div class="studio-row"><div><strong>${esc(m.teamA)} vs. ${esc(m.teamB)}</strong><small>${i===0?'MATCHUP OF THE WEEK CANDIDATE · ':''}Combined power score ${m.combinedScore}</small></div></div>`).join(''):'<div class="tip">Upcoming pairings are not available yet from Sleeper.</div>'}</div><div class="tip" style="margin-top:20px">Dynasty rankings need verified current player valuations and draft capital. Sleeper exposes roster and traded-pick IDs, but does not itself supply a calibrated dynasty market value for each player. Dynasty rankings remain editorial until that valuation model is connected.</div></div>`:''}</main>`
}

function render(){document.title= `${data.settings.name} — Fantasy Football Headquarters`;document.getElementById('app').innerHTML=nav()+(state.page==='history'?history():state.page==='rankings'?rankings():state.page==='sleeper'?sleeperHub():state.page==='owners'?ownersHall():state.page==='countdown'?countdown():home())+footer()+(state.articleId?articleDialog():'')+(state.ownerId?ownerDialog():'')+(state.studio?studio():'');document.body.style.overflow=state.studio||state.articleId?'hidden':''}
function toast(s){const prev=document.querySelector('.toast');if(prev)prev.remove();let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),3600)}
function getForm(f){return Object.fromEntries(new FormData(f).entries())}
function saveRankRows(){const r=data.rankings[state.rankTab];document.querySelectorAll('[data-rank-row]').forEach(el=>{let e=r.entries.find(x=>x.id===el.dataset.rankRow);if(e)el.querySelectorAll('[data-key]').forEach(inp=>e[inp.dataset.key]=inp.value)});const date=document.querySelector('#s-rankUpdated');const intro=document.querySelector('#s-rankIntro');if(date)r.updated=date.value;if(intro)r.intro=intro.value;save()}
function saveForm(f){const kind=f.dataset.form,o=getForm(f);if(kind==='owner-profile'){const id=o.ownerId;if(!id)return;data.ownerAliases[id]=o.historicalName||'';data.ownerBios[id]=o.ownerBio||'';const file=f.querySelector('input[name=sprite]')?.files?.[0];if(file){if(file.size>5000000){toast('Please use an image under 5MB.');return}const reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=c.height=96;let ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,96,96);ctx.drawImage(img,0,0,96,96);data.ownerSprites[id]=c.toDataURL('image/png');save();render();toast('Sprite saved')};img.src=reader.result};reader.readAsDataURL(file);return}save();toast('Owner history mapping saved');render();return}if(kind==='video'){if(!safeVideoEmbed(o.videoUrl)){toast('Please use a valid YouTube video link.');return}data.videoEpisodes.push({title:o.videoTitle,date:o.videoDate,url:o.videoUrl});save();render();toast('Video added');return}if(kind==='settings'){data.settings={...data.settings,name:o.name?.trim()||'THE 201 INVITATIONAL',subtitle:o.subtitle?.trim()||'FANTASY FOOTBALL HQ',commissioner:o.commissioner?.trim()||'The Commissioner',founded:Math.min(CURRENT_YEAR,Math.max(1990,Number(o.founded)||2012)),description:o.description||''};initSeasons();toast('Site settings saved')}else if(kind==='team'){let name=o.teamName?.trim();if(!name)return;if(data.teams.some(t=>t.name.toLowerCase()===name.toLowerCase())){toast('That team is already listed.');return}data.teams.push({name,owner:o.teamOwner?.trim()||''});toast('Team added')}else if(kind==='article'){const id=state.editingArticle||('story-'+Date.now());let a=data.articles.find(x=>x.id===id);const item={id,title:o.title?.trim()||'Untitled',category:o.category?.trim()||'League News',author:o.author?.trim()||data.settings.commissioner,date:o.date||new Date().toISOString().slice(0,10),excerpt:o.excerpt||'',image:o.image||'',body:o.body||'',published:o.published==='on'};if(a)Object.assign(a,item);else data.articles.push(item);state.editingArticle=null;toast(item.published?'Article published':'Draft saved')}else if(kind==='history'){let s=data.seasons.find(x=>String(x.year)===state.editHistoryYear);if(!s)return;s.champion=o.champion?.trim()||'';if(s.coChampions&&s.champion!==s.coChampions.join(' / '))delete s.coChampions;s.runnerUp=o.runnerUp?.trim()||'';s.regularSeason=o.regularSeason?.trim()||'';s.highestPoints=o.highestPoints?.trim()||'';s.notes=o.notes||'';s.standings=(o.standings||'').split('\n').filter(x=>x.trim()).map(line=>{const parts=line.split('|').map(x=>x.trim());return parts.length>=4?{team:parts[0],w:Number(parts[1])||0,l:Number(parts[2])||0,pf:Number(parts[3])||0,finish:parts.slice(4).join(' | ')}:null}).filter(Boolean);toast(s.year+' season saved')}save();render()}
function download(name,text,type){const blob=new Blob([text],{type});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2500)}
function exportHtml(){saveRankRows();const doc=document.documentElement.cloneNode(true);const app=doc.querySelector('#app');if(app)app.innerHTML='';const script=doc.querySelector('#site-data');script.textContent=JSON.stringify(data).replace(/</g,'\\u003c');download(slug(data.settings.name)+'-website.html','<!DOCTYPE html>\n'+doc.outerHTML,'text/html;charset=utf-8');toast('Website exported! Rename it index.html when hosting.')}
function handle(action,el){if(action==='remove-video'){data.videoEpisodes.splice(Number(el.dataset.index),1);save();render();return}if(action==='owner-profile'){state.ownerId=el.dataset.ownerId;render();return}if(action==='close-owner'||action==='close-owner-overlay'){state.ownerId=null;render();return}if(action==='download-script'){download('the-201-countdown-weekly-script.txt',showScript(),'text/plain');return}if(action==='sleeper-sync'){fetchSleeperData();return}if(action==='sleeper-import'){document.getElementById('sleeper-json')?.click();return}if(action==='sleeper-drafts'){sleeperDrafts();return}if(action==='nav'){switchPage(el.dataset.page);return}if(action==='rank-tab'){state.rankTab=el.dataset.type;switchPage('rankings');return}if(action==='history-year'){state.historyYear=el.dataset.year;render();if(state.page!=='history')switchPage('history');return}if(action==='open-studio'){state.studio=true;state.studioTab=el.dataset.studioTab||'settings';state.editingArticle=null;render();return}if(action==='close-studio'||action==='close-studio-overlay'){state.studio=false;render();return}if(action==='studio-tab'){if(state.studioTab==='rankings')saveRankRows();state.studioTab=el.dataset.tab;render();return}if(action==='read-article'){state.articleId=el.dataset.id;render();return}if(action==='close-article'||action==='close-article-overlay'){state.articleId=null;render();return}if(action==='remove-team'){if(confirm('Remove this team from the team directory? Historical records and rankings will remain.')){data.teams.splice(Number(el.dataset.index),1);save();render()}return}if(action==='remove-article'){if(confirm('Delete this article?')){data.articles=data.articles.filter(x=>x.id!==el.dataset.id);if(state.editingArticle===el.dataset.id)state.editingArticle=null;save();render()}return}if(action==='edit-article'){state.editingArticle=el.dataset.id;render();return}if(action==='new-article'){state.editingArticle=null;render();return}if(action==='rank-studio-tab'){saveRankRows();state.rankTab=el.dataset.type;render();return}if(action==='add-ranked-team'){saveRankRows();const sel=document.querySelector('#add-rank-team');const v=sel?.value;if(!v){toast('Select a team first.');return}data.rankings[state.rankTab].entries.push({id:'r'+Date.now()+Math.floor(Math.random()*10000),team:v,record:'',trend:'—',blurb:''});save();render();return}if(action==='fill-rankings'){saveRankRows();const r=data.rankings[state.rankTab];for(const t of data.teams){if(!r.entries.some(e=>e.team===t.name))r.entries.push({id:'r'+Date.now()+Math.floor(Math.random()*100000),team:t.name,record:'',trend:'—',blurb:''})}save();render();return}if(action==='move-rank'){saveRankRows();const r=data.rankings[state.rankTab].entries,i=Number(el.dataset.index),j=i+Number(el.dataset.dir);if(j>=0&&j<r.length)[r[i],r[j]]=[r[j],r[i]];save();render();return}if(action==='remove-rank'){saveRankRows();data.rankings[state.rankTab].entries.splice(Number(el.dataset.index),1);save();render();return}if(action==='save-rankings'){saveRankRows();toast('Rankings saved.');render();return}if(action==='export-json'){if(state.studioTab==='rankings')saveRankRows();download(slug(data.settings.name)+'-data.json',JSON.stringify(data,null,2),'application/json');toast('Backup downloaded.');return}if(action==='export-website'){exportHtml();return}if(action==='import-json'){document.querySelector('#json-import')?.click();return}if(action==='reset-site'){if(confirm('Reset this browser to the website’s embedded data? Your local edits will be lost.')){localStorage.removeItem(STORAGE);data=clone(INITIAL);initSeasons();ensureExtras();state.studio=false;state.editingArticle=null;render();toast('Local data reset.')}return}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;if(['close-studio-overlay','close-article-overlay','close-owner-overlay'].includes(el.dataset.action)&&e.target!==el)return;e.preventDefault();handle(el.dataset.action,el)});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();saveForm(f)});
document.addEventListener('change',e=>{if(e.target.id==='sleeper-json'){const f=e.target.files?.[0];if(f)f.text().then(t=>{try{importSleeperSnapshot(JSON.parse(t));toast('Sleeper snapshot imported successfully.')}catch(err){alert('Could not import this snapshot: '+err.message)}});return}if(e.target.id==='history-edit-year'){state.editHistoryYear=e.target.value;render()}if(e.target.id==='json-import'){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let input=JSON.parse(reader.result);if(!input.settings||!Array.isArray(input.seasons)||!Array.isArray(input.articles)||!input.rankings||!Array.isArray(input.teams))throw Error('invalid format');if(!confirm('Replace your local league data with this JSON backup?'))return;data=input;initSeasons();ensureExtras();save();state.studio=false;render();toast('Backup restored.')}catch(error){toast('This does not look like a valid league data backup.')}};reader.readAsText(file)}});
window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(['home','rankings','history','sleeper','owners','countdown'].includes(p)&&p!==state.page){state.page=p;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.studio||state.articleId||state.ownerId)){state.studio=false;state.articleId=null;state.ownerId=null;render()}});
render();
})();
</script>
