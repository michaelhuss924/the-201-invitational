
name: Refresh Sleeper scores and rankings

on:
  schedule:
    - cron: '0 14 * * 3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sleeper-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get latest Sleeper snapshot
        run: python3 sleeper_sync.py --output sleeper_snapshot_2026.json

      - name: Build updated website
        run: |
          python3 build_site.py --snapshot sleeper_snapshot_2026.json
          python3 -m py_compile build_site.py sleeper_sync.py

      - name: Publish updated website
        run: |
          git config user.name '201 Invitational League Bot'
          git config user.email '201-invitational-bot@users.noreply.github.com'
          git add public/index.html
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
          else
            git commit -m 'Refresh weekly league data'
            git push
          fi
